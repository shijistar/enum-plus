<script type="module">
  import { getGlobalValueFromUrl } from './scripts/global.js';

  const globalTheme = getGlobalValueFromUrl('theme');
  const isPreferDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = (!globalTheme && isPreferDark) || globalTheme === 'dark' ? 'dark' : 'light';
  if (theme === 'dark') {
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.background = `
      radial-gradient(circle at top left, rgb(46 169 162 / 18%), transparent 28%),
      radial-gradient(circle at top right, rgb(255 153 72 / 14%), transparent 22%),
      linear-gradient(180deg, rgb(13 20 28 / 96%), rgb(8 13 19 / 98%))`;
  }
</script>
