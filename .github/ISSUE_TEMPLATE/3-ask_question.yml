name: '❓ Ask a Question'
description: 'Need help? Ask a question about usage, implementation, etc.'
title: '[Question]: '
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for reaching out!

        Before asking your question, please make sure you've checked:
        - The documentation
        - The Issues list (both open and closed)

        Providing as much detail as possible will help us answer your question more effectively.

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: I'd like to understand how to ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide some background about your use case or what you're trying to achieve
      placeholder: I'm trying to implement... / I'm working on a project that...
    validations:
      required: false

  - type: textarea
    id: attempted
    attributes:
      label: What I've Tried
      description: Describe what you've already tried to solve your problem
      placeholder: I've looked at the documentation and tried...
    validations:
      required: false

  - type: textarea
    id: code-example
    attributes:
      label: Code Example
      description: Provide a minimal code example to reproduce your issue, if you wish. Please paste your code directly in the box below, it will be automatically formatted as TypeScript code when displayed.
      placeholder: console.log('Hello, enum-plus!');
      render: typescript
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: enum-plus version
      description: Which version of enum-plus are you using?
      placeholder: e.g. 2.2.8
    validations:
      required: true

  - type: input
    id: typescript-version
    attributes:
      label: TypeScript version
      description: Which version of TypeScript are you installing?
      placeholder: e.g. 5.9.3
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other details that might help us answer your question, if applicable
      placeholder: Additional information, screenshots, error messages, etc.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I have checked the documentation
          required: true
        - label: I have searched existing issues and confirmed this is not a duplicate
          required: true
        - label: I have removed any sensitive information (personal data, access tokens, etc.)
          required: true
